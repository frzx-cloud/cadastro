<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
        background: #1a1a1a;
        color: #f5f5f5;
        padding-top: 50px;

        /* Fundo estilo barbearia */
        background-image:
            linear-gradient(45deg, #151515 25%, transparent 25%),
            linear-gradient(-45deg, #151515 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #151515 75%),
            linear-gradient(-45deg, transparent 75%, #151515 75%);
        background-size: 40px 40px;
        background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
    }

    h1 {
        font-size: 38px;
        color: #d4af37;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 30px;

        text-shadow: 2px 2px 4px #000;
    }

    .container {
        max-width: 450px;
        width: 90%;
        margin: 0 auto;
        padding: 35px;

        background: #242424;
        border: 2px solid #d4af37;
        border-radius: 12px;

        box-shadow:
            0 0 15px rgba(212, 175, 55, 0.25),
            0 8px 20px rgba(0, 0, 0, 0.7);

        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: left;
    }

    /* Pequeno detalhe decorativo */
    .container::before {
        content: "✦ BARBEARIA ✦";
        text-align: center;
        color: #d4af37;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 3px;
        margin-bottom: 10px;
    }

    label {
        color: #d4af37;
        font-weight: bold;
        font-size: 15px;
        letter-spacing: 1px;
    }

    input {
        width: 100%;
        padding: 12px;
        background: #111;
        color: white;

        border: 1px solid #555;
        border-radius: 6px;

        outline: none;
        font-size: 15px;

        transition: 0.3s;
    }

    input:focus {
        border-color: #d4af37;
        box-shadow: 0 0 6px rgba(212, 175, 55, 0.5);
    }

    input::placeholder {
        color: #888;
    }

    /* Botão Mostrar */
    button {
        cursor: pointer;
        padding: 10px 15px;

        background: #3a3a3a;
        color: #d4af37;

        border: 1px solid #d4af37;
        border-radius: 6px;

        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        background: #d4af37;
        color: #111;
    }

    /* Botão Enviar */
    input[type="submit"] {
        background: #d4af37;
        color: #111;

        border: none;
        cursor: pointer;

        font-weight: bold;
        font-size: 17px;

        margin-top: 15px;
        padding: 13px;

        border-radius: 6px;

        text-transform: uppercase;
        letter-spacing: 1px;

        transition: 0.3s;
    }

    input[type="submit"]:hover {
        background: #f0cf55;

        transform: translateY(-2px);

        box-shadow: 0 5px 12px rgba(212, 175, 55, 0.3);
    }

    /* Mensagem */
    .toast {
        visibility: hidden;

        min-width: 250px;

        background-color: #d4af37;
        color: #111;

        text-align: center;

        border-radius: 6px;
        padding: 16px;

        position: fixed;
        z-index: 1;

        left: 50%;
        bottom: 30px;

        transform: translateX(-50%);

        font-weight: bold;
    }

    .toast.show {
        visibility: visible;
        animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }

    @keyframes fadein {
        from {
            bottom: 0;
            opacity: 0;
        }

        to {
            bottom: 30px;
            opacity: 1;
        }
    }

    @keyframes fadeout {
        from {
            bottom: 30px;
            opacity: 1;
        }

        to {
            bottom: 0;
            opacity: 0;
        }
    }

    .password-container {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Responsividade */
    @media (max-width: 500px) {
        body {
            padding-top: 25px;
        }

        h1 {
            font-size: 28px;
        }

        .container {
            padding: 25px;
        }
    }
</style>
