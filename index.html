<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
         body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        text-align: center;
        background-color: #ddd;
        padding-top: 50px;
        }

         .container {
        max-width: 400px; 
        width: 100%; 
        margin: 0 auto; 
        padding: 30px;
        background-color: #f4f4f4;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        gap: 15px;
        text-align: left;
        }
         input[ type="submit"] {
        background-color: green;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
        border-radius: 10px;
        }

         .toast {
        visibility: hidden;
        min-width: 250px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 5px;
        padding: 16px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        }

        .toast.show {
        visibility: visible;
        animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            }

        button {
            cursor: pointer;
            padding: 8px;
            }
        
        
    </style>
    <script>
        function pesquisarcep(){
            document.getElementById("rua").value = ""
            document.getElementById("bairro").value = ""
            document.getElementById("uf").value = ""
            document.getElementById("cidade").value = ""
            

            var validacep = /^[0-9]{8}$/

            const cep = document.getElementById("cep").value
            if(validacep.test(cep)){
                const link = "https://viacep.com.br/ws/" + cep + "/json/?callback=preencherEndereco"
                var script = document.createElement("script")
                script.src = link
                document.body.appendChild(script)
            } else {
              document.getElementById("cep").value = ""
                var x = document.getElementById("toast");
                x.className = "toast show";
                x.textContent = "CEP digitado inexistente!"
                setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
                
            }
            
        }
        function preencherEndereco(conteudo){
            if(!("erro" in conteudo)){
                document.getElementById("rua").value = conteudo.logradouro
                document.getElementById("bairro").value = conteudo.bairro
                document.getElementById("cidade").value = conteudo.localidade
                document.getElementById("uf").value = conteudo.estado 
            } else {
                var x = document.getElementById("toast");
                x.className = "toast show";
                x.textContent = "CEP digitado inexistente!"
                setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
            }
            
        }

        function toggleSenha() {
            const input = document.getElementById("senha");
            const btn = document.querySelector("button");

        if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Esconder";
        } else {
        input.type = "password";
        btn.textContent = "Mostrar";
        }
  }

    </script>
</head>
<body>
    <h1>Cadastro de Clientes</h1>
    <div>
    <form>
        <main class="container">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required placeholder="Digite seu nome aqui">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="digiteseuemail@email">
        <label for="celular">Telefone</label>
        <input type="telefone" id="celular" required placeholder="99999-9999">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" required placeholder="29210115651">
        <label for="cep">CEP</label> 
        <input type="text" id="cep" onblur="pesquisarcep()" required placeholder="12345678">
        <label for="rua">Rua</label>
        <input type="text" id="rua" required placeholder="Digite aqui a rua">
        <label for="numero">Número</label>
        <input type="text" id="numero" required placeholder="Digite aqui o Número">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" required placeholder="Digite aqui o Bairro">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" required placeholder="Digite aqui a cidade">
        <label for="uf">Estado</label>
        <input type="text" id="uf" required placeholder="Digite aqui o Estado">
        <label for="senha">senha</label>
        <input type="password" id="senha" required placeholder="Digite aqui sua senha">
        <button type="button" onclick="toggleSenha()">Mostrar</button>
        <input type="submit" value="Enviar Cadastro">
        <div id="toast" class="toast"></div>
        </main>
    </div>
    </form>
</body>
</html>
